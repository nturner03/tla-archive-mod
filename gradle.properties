# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties (pack pins: ~/tla-packwiz/docs/setup-notes.md)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Dependency versions (pack pins). Coordinates and sources: docs/project-setup.md
ae2_version=19.2.18
ae2_version_range=[19.2.18,20)
# GuideME 21.1.21, by Modrinth version id: the pack's exact file (Maven Central's 21.1.21 jar is a different build).
guideme_modrinth_version=JBFCgJmg
ftb_teams_version=2101.1.11
ftb_teams_version_range=[2101.1.11,2102)
ftb_library_version=2101.1.39
architectury_version=13.0.11

## Mod Properties

# Must fit the regex [a-z][a-z0-9_]{1,63} and match TlaArchive.MOD_ID.
mod_id=tla_archive
mod_name=The Last Archive
mod_license=LGPL-3.0-only
# The mod's own semantic version, independent of the pack's. https://semver.org/
mod_version=0.2.0
# Matches the base package of the mod sources.
mod_group_id=io.github.nturner03.tlaarchive
