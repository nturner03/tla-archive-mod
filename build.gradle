plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // AE2 and GuideME: https://github.com/AppliedEnergistics/Applied-Energistics-2#maven
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'FTB'
                url = 'https://maven.ftb.dev/releases'
            }
        }
        filter { includeGroup 'dev.ftb.mods' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Architectury'
                url = 'https://maven.architectury.dev'
            }
        }
        filter { includeGroup 'dev.architectury' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Launches GameTestServer, runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' puts a dependency on the dev-run classpath without publishing it.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The pack supplies these mods at runtime, so they are compile-only here.
    // Transitive dependencies are off: every mod on the classpath is pinned
    // explicitly to the pack's version instead of the version a POM asks for.
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}:api"
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }

    // Dev runs (runClient/runServer) load the same mods as the pack.
    localRuntime("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    localRuntime("maven.modrinth:guideme:${guideme_modrinth_version}") { transitive = false }
    localRuntime("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    localRuntime("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    localRuntime("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
}

// Expands the declared properties into src/main/templates (neoforge.mods.toml).
// A missing property is an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            ae2_version_range      : ae2_version_range,
            ftb_teams_version_range: ftb_teams_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Ship the license texts in the jar.
tasks.named('jar', Jar).configure {
    from(files('COPYING', 'COPYING.LESSER')) {
        into 'META-INF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Byte-for-byte reproducible archives (Gradle 9 defaults, stated explicitly).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
